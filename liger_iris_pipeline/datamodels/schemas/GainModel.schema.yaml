%YAML 1.1
---
$schema: "http://stsci.edu/schemas/fits-schema/fits-schema"
id: "https://oirlab.github.io/schemas/GainModel.schema"
allOf:
- $ref: calibration_core.schema
- type: object
  properties:
    gain:
      title: 2-D data array describing the gain conversion in e-/DN
      fits_hdu: GAIN
      ndim: 2
      datatype: float32
    rn:
      title: 2-D error array
      fits_hdu: RN
      ndim: 2
      datatype: float32
    cov:
      title: 4-D covariance array
      fits_hdu: COV
      ndim: 4
      datatype: float32
    dq:
      title: 2-D data quality array
      fits_hdu: DQ
      default: 0
      ndim: 2
      datatype: uint32