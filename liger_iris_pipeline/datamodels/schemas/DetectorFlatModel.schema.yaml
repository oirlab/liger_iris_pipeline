%YAML 1.1
---
$schema: "http://stsci.edu/schemas/fits-schema/fits-schema"
id: "https://oirlab.github.io/schemas/DetectorFlatModel.schema"
allOf:
- $ref: calibration_core.schema
- type: object
  properties:
    data:
      title: 2-D data array of detector flat data in relative e-/s.
      fits_hdu: DATA
      ndim: 2
      datatype: float32
    err:
      title: 2-D error array of detector flat data.
      fits_hdu: ERR
      ndim: 2
      datatype: float32
      default: 0
    var_poisson:
      title: 2-D Poisson variance array
      fits_hdu: VAR_POISSON
      default: 0
      ndim: 2
      datatype: float32
    var_rnoise:
      title: 2-D read noise variance array
      fits_hdu: VAR_RNOISE
      default: 0
      ndim: 2
      datatype: float32
    dq:
      title: 2-D data quality array
      fits_hdu: DQ
      ndim: 2
      datatype: uint32
      default: 0