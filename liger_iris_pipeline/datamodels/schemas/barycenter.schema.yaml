%YAML 1.1
---
$schema: "http://stsci.edu/schemas/fits-schema/fits-schema"
id: "https://oirlab.github.io/schemas/barycenter.schema"
type: object
properties:
  meta:
    type: object
    properties:
      barycenter:
        title: Barycentric information
        type: object
        properties:
          barycenter_correction:
            title: "Barycentric velocity correction at exposure midtime"
            type: number
            fits_keyword: BARYCORR
            blend_rule: first
            blend_table: False
          heliocentric_correction:
            title: "Heliocentric velocity correction at exposure midtime"
            type: number
            fits_keyword: HELICORR
            blend_rule: first
            blend_table: False