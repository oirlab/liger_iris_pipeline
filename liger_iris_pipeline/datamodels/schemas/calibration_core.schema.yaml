%YAML 1.1
---
$schema: "http://stsci.edu/schemas/fits-schema/fits-schema"
id: "https://oirlab.github.io/schemas/calibration_core.schema"
allOf:
- $ref: core.schema
type: object
properties:
  meta:
    type: object
    properties:
      master_cal:
        title: Is this a master calibration file?
        type: boolean
        fits_keyword: MASTCAL
        blend_table: True
        blend_rule: multi
        cal_db: master_cal
      cal_type:
        title: Calibration file type
        type: string
        fits_keyword: CALTYPE
        cal_db: cal_type
      cal_id:
        title: Calibration file ID
        type: string
        fits_keyword: CALID
        cal_db: id
      cal_version:
        title: Calibration file version
        type: string
        fits_keyword: CALVER
        cal_db: cal_version
      origin:
        title: Origin of the calibration file
        type: string
        fits_keyword: ORIGIN
        blend_table: True
        blend_rule: multi
        cal_db: origin
        enum: [KECK, LOCAL]