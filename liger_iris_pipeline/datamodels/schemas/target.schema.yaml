%YAML 1.1
---
$schema: "http://stsci.edu/schemas/fits-schema/fits-schema"
id: "https://oirlab.github.io/schemas/target.schema"
type: object
properties:
  meta:
    type: object
    properties:
      target:
        title: Target information
        type: object
        properties:
          name: # Revisit this once user interface is defined.
            title: Target or object name, internal or on-sky
            type: string
            fits_keyword: OBJECT
            blend_rule: first
            blend_table: True
            cal_db: target_name
          equinox:
            title: Equinox of target coordinates
            type: number
            fits_keyword: EQUINOX
            blend_rule: multi
          ra:
            title: Target RA
            type: number
            fits_keyword: RA
            blend_rule: first
            blend_table: True
          dec:
            title: Target Dec
            type: number
            fits_keyword: DEC
            blend_rule: first
            blend_table: True
          ra_uncertainty:
            title: Target RA uncertainty
            type: number
            fits_keyword: RAUNC
            blend_rule: first
          dec_uncertainty:
            title: Target Dec uncertainty
            type: number
            fits_keyword: DECUNC
            blend_rule: first
          proper_motion_ra:
            title: Target proper motion in RA
            type: number
            fits_keyword: MURA
            blend_rule: first
          proper_motion_dec:
            title: Target proper motion in Dec
            type: number
            fits_keyword: MUDEC
            blend_rule: first
          proper_motion_epoch:
            title: Target proper motion epoch
            type: number
            fits_keyword: MUEPOCH
            blend_rule: first
          source_type:
            title: Source type
            type: string
            # enum: [EXTENDED, POINT, UNKNOWN, CALIBRATION] # TODO: Uncomment once model blender supports enums
            fits_keyword: SRCTYPE
            blend_rule: first
            blend_table: True
          airmass_start:
            title: Airmass at start of exposure
            type: number
            fits_keyword: AIRMST
            blend_rule: mean
            blend_table: True
          airmass_end:
            title: Airmass at end of exposure
            type: number
            fits_keyword: AIRMEND
            blend_rule: mean
            blend_table: True
          azimuth_start:
            title: Azimuth at start of exposure
            type: number
            fits_keyword: AZIMST
            blend_rule: mean
            blend_table: True
          azimuth_end:
            title: Azimuth at end of exposure
            type: number
            fits_keyword: AZIMEND
            blend_rule: mean
            blend_table: True
          elevation_start:
            title: Elevation at start of exposure
            type: number
            fits_keyword: ELEVAST
            blend_rule: mean
            blend_table: True
          elevation_end:
            title: Elevation at end of exposure
            type: number
            fits_keyword: ELEVAEND
            blend_rule: mean
            blend_table: True
          parallactic_angle_start:
            title: Parallactic angle of the target at the start of the exposure.
            type: number
            fits_keyword: PANGST
            blend_rule: mean
          parallactic_angle_end:
            title: Parallactic angle of the target at the end of the exposure.
            type: number
            fits_keyword: PANGEND
            blend_rule: mean