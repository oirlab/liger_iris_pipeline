%YAML 1.1
---
$schema: "http://stsci.edu/schemas/fits-schema/fits-schema"
id: "https://oirlab.github.io/schemas/BiasModel.schema"
allOf:
- $ref: calibration_core.schema
- type: object
  properties:
    data:
      title: 2-D data array
      fits_hdu: DATA
      ndim: 2
      datatype: float32
    err:
      title: 2-D data quality array
      fits_hdu: ERR
      default: 0
      ndim: 2
      datatype: float32
    dq:
      title: 2-D data quality array
      fits_hdu: DQ
      default: 0
      ndim: 2
      datatype: uint32