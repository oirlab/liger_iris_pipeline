%YAML 1.1
---
$schema: "http://stsci.edu/schemas/fits-schema/fits-schema"
id: "https://oirlab.github.io/schemas/wcsinfo.schema"
type: object
properties:
  meta:
    type: object
    properties:
      # using the PRIMARY extension, but JWST convention is actually the SCI hdu
      # Consider how this works with other applications
      coordinates:
        title: Information about the coordinates in the file
        type: object
        properties:
          reference_frame:
            title: Name of the coordinate reference frame
            type: string
            default: ICRS
            fits_keyword: RADESYS
            enum: [ICRS, FK5]
            fits_hdu: PRIMARY
      wcsinfo:
        title: WCS parameters
        type: object
        properties:
          wcsaxes:
            title: number of World Coordinate System axes
            type: integer
            fits_keyword: WCSAXES
            fits_hdu: PRIMARY
          crpix1:
            title: axis 1 coordinate of the reference pixel
            type: number
            fits_keyword: CRPIX1
            fits_hdu: PRIMARY
          crpix2:
            title: axis 2 coordinate of the reference pixel
            type: number
            fits_keyword: CRPIX2
            fits_hdu: PRIMARY
          crpix3:
            title: axis 3 coordinate of the reference pixel
            type: number
            fits_keyword: CRPIX3
            fits_hdu: PRIMARY
          crval1:
            title: first axis value at the reference pixel
            type: number
            fits_keyword: CRVAL1
            fits_hdu: PRIMARY
          crval2:
            title: second axis value at the reference pixel
            type: number
            fits_keyword: CRVAL2
            fits_hdu: PRIMARY
          crval3:
            title: third axis value at the reference pixel
            type: number
            fits_keyword: CRVAL3
            fits_hdu: PRIMARY
          ctype1:
            title: first axis coordinate type
            type: string
            fits_keyword: CTYPE1
            fits_hdu: PRIMARY
          ctype2:
            title: second axis coordinate type
            type: string
            fits_keyword: CTYPE2
            fits_hdu: PRIMARY
          ctype3:
            title: third axis coordinate type
            type: string
            fits_keyword: CTYPE3
            fits_hdu: PRIMARY
          cunit1:
            title: first axis units
            type: string
            fits_keyword: CUNIT1
            fits_hdu: PRIMARY
          cunit2:
            title: second axis units
            type: string
            fits_keyword: CUNIT2
            fits_hdu: PRIMARY
          cunit3:
            title: third axis units
            type: string
            fits_keyword: CUNIT3
            fits_hdu: PRIMARY
          cdelt1:
            title: first axis increment per pixel
            type: number
            fits_keyword: CDELT1
            fits_hdu: PRIMARY
          cdelt2:
            title: second axis increment per pixel
            type: number
            fits_keyword: CDELT2
            fits_hdu: PRIMARY
          cdelt3:
            title: third axis increment per pixel
            type: number
            fits_keyword: CDELT3
            fits_hdu: PRIMARY
          pc1_1:
            title: linear transformation matrix element
            type: number
            fits_keyword: PC1_1
            fits_hdu: PRIMARY
          pc1_2:
            title: linear transformation matrix element
            type: number
            fits_keyword: PC1_2
            fits_hdu: PRIMARY
          pc1_3:
            title: linear transformation matrix element
            type: number
            fits_keyword: PC1_3
            fits_hdu: PRIMARY
          pc2_1:
            title: linear transformation matrix element
            type: number
            fits_keyword: PC2_1
            fits_hdu: PRIMARY
          pc2_2:
            title: linear transformation matrix element
            type: number
            fits_keyword: PC2_2
            fits_hdu: PRIMARY
          pc2_3:
            title: linear transformation matrix element
            type: number
            fits_keyword: PC2_3
            fits_hdu: PRIMARY
          pc3_1:
            title: linear transformation matrix element
            type: number
            fits_keyword: PC3_1
            fits_hdu: PRIMARY
          pc3_2:
            title: linear transformation matrix element
            type: number
            fits_keyword: PC3_2
            fits_hdu: PRIMARY
          pc3_3:
            title: linear transformation matrix element
            type: number
            fits_keyword: PC3_3
            fits_hdu: PRIMARY
          ps3_0:
            title: Coordinate table extension name
            type: string
            fits_keyword: PS3_0
            fits_hdu: PRIMARY
          ps3_1:
            title: Coordinate table column name
            type: string
            fits_keyword: PS3_1
            fits_hdu: PRIMARY
          s_region:
            title: spatial extent of the observation
            type: string
            default: " "
            fits_keyword: S_REGION
            fits_hdu: PRIMARY
          waverange_start:
            title: lower bound of the default wavelength range
            type: number
            fits_keyword: WAVSTART
            fits_hdu: PRIMARY
          waverange_end:
            title: upper bound of the default wavelength range
            type: number
            fits_keyword: WAVEND
            fits_hdu: PRIMARY
          dispersion_direction:
            title: Dispersion direction
            type: integer
            fits_keyword: DISPAXIS
            fits_hdu: PRIMARY
          spectral_order:
            title: Spectral order number
            type: integer
            fits_keyword: SPORDER
            fits_hdu: PRIMARY
          velosys: # Duplicated in barycenter.schema.yaml
            title: "[m/s] Radial velocity wrt Barycenter"
            type: number
            fits_keyword: VELOSYS
            fits_hdu: PRIMARY
          specsys:
            title: Spectral reference frame
            type: string
            fits_keyword: SPECSYS
            fits_hdu: PRIMARY