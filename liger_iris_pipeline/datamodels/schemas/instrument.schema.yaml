%YAML 1.1
---
$schema: "http://stsci.edu/schemas/fits-schema/fits-schema"
id: "https://oirlab.github.io/schemas/instrument.schema"
type: object
properties:
  meta:
    type: object
    properties:
      instrument:
        title: Instrument configuration information
        type: object
        properties:
          name:
            title: Name of the instrument used to acquire the data
            type: string
            enum: [Liger, IRIS, MULTIPLE]
            fits_keyword: INSTRUME
            blend_rule: multi
            blend_table: True
          era:
            title: Instrument era specified via semver
            type: string
            fits_keyword: INSTERA
            blend_rule: multi
            blend_table: True
            default: "0.0.1"
            cal_db: instrument_era
          detector:
            title: Name of detector used to acquire the data
            type: string
            enum: [IMG, IMG1, IMG2, IMG3, IMG4, IFS, N/A, MULTIPLE]
            fits_keyword: DETECTOR
            blend_rule: multi
            blend_table: True
            cal_db: detector
          mode:
            title: Mode of the instrument
            type: string
            enum: [IMG, IFS, MULTIPLE, NONE, None, N/A]
            fits_keyword: INSTMODE
            blend_rule: multi
            blend_table: True
            cal_db: instrument_mode
          ifs_mode:
            title: Mode of the instrument (IMG or SLICER, LENSLET)
            type: string
            enum: [SLICER, LENSLET, NONE, None, N/A, MULTIPLE]
            fits_keyword: IFSMODE
            blend_rule: multi
            blend_table: True
            cal_db: ifs_mode
          filter:
            title: Name of the filter element used
            type: string
            enum: [ # TODO: Keep this list updated with actual filter names
              ANY, CLEAR, OPAQUE, MULTIPLE, NONE, None, N/A,
              Zbb, Ybb, Jbb, Hbb, Kbb,
              Z, Y, J, H, Ks, K,
              ZN1, ZN2, ZN3, ZN4,
              YN1, YN2, YN3,
              JN1, JN2, JN3, JN4,
              HN1, HN2, HN3, HN4, HN5,
              KN1, KN2, KN3, KN4, KN5,
              CaIIw, PaBetaw, FeIIw, Br_Gammaw, COw,
              HeI,
              Jcont,
              PaBeta,
              Hcont,
              FeII,
              H2one,
              Kcont,
              Br_Gamma,
              H2two,
              CO,
            ]
            fits_keyword: FILTER
            blend_rule: multi
            blend_table: True
            cal_db: filter
          pupil:
            title: Name of the pupil element used
            type: string
            enum: [ANY, CLEAR, N/A, None, MULTIPLE] # TODO: Add pupil names here when ready
            fits_keyword: PUPIL
            blend_rule: multi
            blend_table: True
            cal_db: pupil
          grating:
            title: Name of the grating element used
            type: string
            enum: [
              Z4000, Y4000, J4000, H4000, K4000, HK4000,
              Z8000, Y8000, J8000, H8000, K8000, K8000a, K8000b,
              H10000, K10000,
              MULTIPLE, N/A,
              NONE, None,
            ]
            fits_keyword: GRATING
            blend_rule: multi
            blend_table: True
            cal_db: grating
          scale:
            title: Average expected pixel scale to on-sky (arcsec/pixel)
            type: number
            fits_keyword: SCALE
            blend_rule: first # NOTE: How to handle multiple number types?
            blend_table: True
            cal_db: scale
          spectral_resolution:
            title: Average expected spectral resolving power
            type: number
            fits_keyword: SPECRES
            blend_rule: first
            blend_table: True
          wave_min:
            title: Minimum wavelength of the spectral range in microns
            type: number
            fits_keyword: WAVEMIN
            blend_rule: first
            blend_table: True
          wave_center:
            title: Central wavelength of the spectral range in microns
            type: number
            fits_keyword: WAVECEN
            blend_rule: first
            blend_table: True
          wave_max:
            title: Maximum wavelength of the spectral range in microns
            type: number
            fits_keyword: WAVEMAX
            blend_rule: first
            blend_table: True
          rotator_angle:
            title: Rotator angle in degrees
            type: number
            fits_keyword: ROTANG
            blend_rule: first
            blend_table: True
            default: 0.0
          channels_are_vertical:
            title: Whether the channels are oriented vertically in the data
            type: boolean
            fits_keyword: CHANVERT
            blend_rule: first
            default: True
          n_channels:
            title: Number of channels in the data
            type: integer
            fits_keyword: NCHAN
            blend_rule: first
            default: 32