%YAML 1.1
---
$schema: "http://stsci.edu/schemas/fits-schema/fits-schema"
id: "https://oirlab.github.io/schemas/IFSCubeModel.schema"
allOf:
- $ref: core.schema
- $ref: wcsinfo.schema.yaml
- type: object
  properties:
    data:
      title: 3-D data array
      fits_hdu: DATA
      ndim: 3
      datatype: float32
    err:
      title: 3-D error array
      fits_hdu: ERR
      ndim: 3
      datatype: float32
    var_poisson:
      title: 2-D Poisson variance array
      fits_hdu: VAR_POISSON
      default: 0
      ndim: 3
      datatype: float32
    var_rnoise:
      title: 2-D read noise variance array
      fits_hdu: VAR_RNOISE
      default: 0
      ndim: 3
      datatype: float32
    dq:
      title: 3-D data quality array
      fits_hdu: DQ
      default: 0
      ndim: 3
      datatype: uint32
    wavelength: # Consider how this works with the wcs spectral info
      title: 1D Wavelength array
      fits_hdu: WAVELENGTH
      ndim: 1
      datatype: float32