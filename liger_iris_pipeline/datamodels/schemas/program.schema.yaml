%YAML 1.1
---
$schema: "http://stsci.edu/schemas/fits-schema/fits-schema"
id: "https://oirlab.github.io/schemas/program.schema"
type: object
properties:
  meta:
    type: object
    properties:
      program:
        title: Program information
        type: object
        properties:
          program_title:
            title: Program Title
            type: string
            fits_keyword: PROGTITL
            blend_rule: multi
            blend_table: True
          principal_investigator:
            title: Principal Investigator Name
            type: string
            fits_keyword: PROGPI
            blend_rule: multi
            blend_table: True
          semester_id:
            title: Semester ID
            type: string
            fits_keyword: SEMID
            blend_rule: multi
            blend_table: True
          program_id:
            title: Program ID
            type: string
            fits_keyword: PROGID
            blend_rule: multi
            blend_table: True
          observation_number:
            title: Observation Number
            type: integer
            fits_keyword: OBSNUM
            blend_rule: multi
            blend_table: True