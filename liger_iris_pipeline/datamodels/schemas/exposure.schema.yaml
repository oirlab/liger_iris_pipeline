%YAML 1.1
---
$schema: "http://stsci.edu/schemas/fits-schema/fits-schema"
id: "https://oirlab.github.io/schemas/exposure.schema"
type: object
properties:
  meta:
    type: object
    properties:
      exposure:
        title: "Exposure information"
        type: object
        properties:
          exposure_type:
            title: Type of data in the exposure  # NOTE: This may drive a lot of the pipeline logic
            type: string
            fits_keyword: IMTYPE
            blend_table: True
          exposure_time:
            title: "Exposure time per frame [s]"
            type: number
            fits_keyword: EXPTIME
            blend_table: True
          exposure_number:
            title: "Exposure number"
            type: integer
            fits_keyword: EXPNUM
          mjd_start:
            title: "Exposure start time in MJD"
            type: number
            fits_keyword: EXPJDST
            blend_table: True
            blend_rule: min
          mjd_end:
            title: "Exposure end time in MJD"
            type: number
            fits_keyword: EXPJDEND
            blend_table: True
            blend_rule: max
          readmode:
            title: Readout mode
            type: string
            fits_keyword: READMODE
            blend_table: True
          nframes:
            title: Number of coadds
            type: integer
            fits_keyword: NFRAMES
            blend_table: True
          ngroups:
            title: Number of groups in integration
            type: integer
            fits_keyword: NGROUPS
            blend_table: True
          nreads:
            title: Number of reads per group
            type: integer
            fits_keyword: NREADS
            blend_table: True