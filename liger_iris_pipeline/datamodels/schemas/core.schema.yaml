# core.schema
%YAML 1.1
---
$schema: http://stsci.edu/schemas/fits-schema/fits-schema
id: https://oirlab.github.io/schemas/core.schema
type: object
allOf:
- $ref: instrument.schema
- $ref: data_quality.schema
- $ref: exposure.schema
- $ref: target.schema
- $ref: barycenter.schema
- $ref: subarray.schema
- $ref: subarray_map.schema
- $ref: steps.schema
- $ref: adaptive_optics.schema
- $ref: program.schema
- $ref: calibration_files.schema
- $ref: calibrations_table.schema
- $ref: receipt_table.schema
properties:
  meta:
    type: object
    properties:
      datetime_obs:
        title: Datetime of the datamodel in ISOT format.
        type: string
        fits_keyword: DATEOBS
        blend_table: True
        blend_rule: mindatetime
        cal_db: datetime_obs
      data_level:
        title: Data level
        type: string
        fits_keyword: DATALVL
        blend_table: False
        blend_rule: multi
      filename:
        title: Name of the file
        type: string
        fits_keyword: FILENAME
        blend_table: true
        blend_rule: multi
        cal_db: filename
      filetype:
        title: Type of data in the file
        type: string
        default: FITS
        fits_keyword: FILETYPE
        blend_table: False
        blend_rule: multi
      telescope:
        title: Telescope used to acquire the data
        type: string
        fits_keyword: TELESCOP
        blend_table: False
        blend_rule: multi
      model_type:
        title: Type of data model
        type: string
        fits_keyword: DATAMODL
        blend_table: True
        blend_rule: multi
      last_processed:
        title: Date and time when model was last processed
        type: string
        fits_keyword: LASTPROC
        blend_rule: maxdatetime
        blend_table: True
        cal_db: last_processed
      drp_version:
        title: Version of liger_iris_pipeline used to process data
        type: string
        fits_keyword: DRPSOFTV
        blend_table: True
        blend_rule: multi
        cal_db: drp_version
      middleware_version:
        title: Version of the middleware used to process data for retrieving references
        type: string
        fits_keyword: MIDLVER
        blend_table: False
        blend_rule: multi